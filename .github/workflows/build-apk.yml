name: Build TWA APK

on:
  workflow_dispatch:
    inputs:
      site_host:
        description: 'Bare host of the site, e.g. example.com'
        required: true
      manifest_url:
        description: 'Full URL to the PWA manifest.json'
        required: true
      icon_url:
        description: 'Full URL to a >=512x512 PNG icon'
        required: true
      app_name:
        description: 'App display name'
        required: true
      package_id:
        description: 'Android package id, e.g. app.pwaforge.abc123 (no hyphens)'
        required: true
      theme_color:
        description: 'Theme color hex, e.g. #0B0B0B'
        required: false
        default: '#0B0B0B'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare project directory
        run: mkdir -p ${{ github.workspace }}/project

      - name: Write twa-manifest.json
        run: |
          cat > ${{ github.workspace }}/project/twa-manifest.json << EOF
          {
            "packageId": "${{ inputs.package_id }}",
            "host": "${{ inputs.site_host }}",
            "name": "${{ inputs.app_name }}",
            "launcherName": "${{ inputs.app_name }}",
            "display": "standalone",
            "themeColor": "${{ inputs.theme_color }}",
            "themeColorDark": "${{ inputs.theme_color }}",
            "navigationColor": "${{ inputs.theme_color }}",
            "navigationColorDark": "${{ inputs.theme_color }}",
            "backgroundColor": "#FFFFFF",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "${{ inputs.icon_url }}",
            "maskableIconUrl": "${{ inputs.icon_url }}",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "/project/release.keystore", "alias": "pwaforge" },
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "webManifestUrl": "${{ inputs.manifest_url }}"
          }
          EOF
          cat ${{ github.workspace }}/project/twa-manifest.json

      # --- Diagnostic steps: each isolates one specific thing so a failure
      # is immediately attributable, without needing raw log text ---

      - name: Diagnostic 1 - pull bubblewrap image
        run: docker pull ghcr.io/googlechromelabs/bubblewrap:latest

      - name: Diagnostic 2 - verify tools inside the image
        run: |
          docker run --rm --entrypoint=/bin/bash ghcr.io/googlechromelabs/bubblewrap:latest -c "whoami && which keytool && which bubblewrap && bubblewrap --version"

      - name: Diagnostic 3 - verify bind-mount write access
        run: |
          docker run --rm --entrypoint=/bin/bash -v ${{ github.workspace }}/project:/project ghcr.io/googlechromelabs/bubblewrap:latest -c "touch /project/write-test.txt && echo wrote-ok"
          ls -la ${{ github.workspace }}/project/

      - name: Diagnostic 4 - generate signing keystore
        run: |
          docker run --rm \
            --entrypoint=/bin/bash \
            -v ${{ github.workspace }}/project:/project \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD=pwaforgeTempPass1 \
            -e BUBBLEWRAP_KEY_PASSWORD=pwaforgeTempPass1 \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            -c 'keytool -genkeypair -v -keystore /project/release.keystore -alias pwaforge -keyalg RSA -keysize 2048 -validity 10000 -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" -dname "CN=PWA Forge,OU=NexaPulse,O=NexaPulse,L=Lagos,S=Lagos,C=NG"'
          ls -la ${{ github.workspace }}/project/

      - name: Diagnostic 5 - bubblewrap build (output captured to file)
        continue-on-error: true
        run: |
          set +e
          docker run --rm \
            --entrypoint=/bin/bash \
            -v ${{ github.workspace }}/project:/project \
            -w /project \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD=pwaforgeTempPass1 \
            -e BUBBLEWRAP_KEY_PASSWORD=pwaforgeTempPass1 \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            -c 'yes | bubblewrap build --skipPwaValidation' > ${{ github.workspace }}/project/build-output.txt 2>&1
          echo "BUBBLEWRAP_EXIT_CODE=$?" | tee -a ${{ github.workspace }}/project/build-output.txt

          echo "--- searching entire container fs for apk/aab (separate run, same mount) ---" | tee -a ${{ github.workspace }}/project/build-output.txt
          docker run --rm \
            --entrypoint=/bin/bash \
            -v ${{ github.workspace }}/project:/project \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            -c 'find / -xdev \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null; find / \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | while read f; do cp "$f" "/project/found-$(basename "$f")"; echo "copied: $f"; done' \
            >> ${{ github.workspace }}/project/build-output.txt 2>&1

          echo "--- host-side /project contents ---" | tee -a ${{ github.workspace }}/project/build-output.txt
          find ${{ github.workspace }}/project -type f | tee -a ${{ github.workspace }}/project/build-output.txt

      - name: Publish captured build log (so it's readable outside the Actions log UI)
        if: always()
        run: |
          B64=$(base64 -w0 ${{ github.workspace }}/project/build-output.txt)
          curl -sS --fail-with-body -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/logs/build-${{ github.run_id }}.txt" \
            -d "{\"message\":\"debug log for run ${{ github.run_id }}\",\"content\":\"$B64\"}"
          echo "Log published to: https://raw.githubusercontent.com/${{ github.repository }}/main/logs/build-${{ github.run_id }}.txt"

      - name: Locate and rename output artifact
        run: |
          cd ${{ github.workspace }}/project
          APK_PATH=$(find . -name "found-*-signed.apk" | head -1)
          if [ -z "$APK_PATH" ]; then APK_PATH=$(find . -name "found-*.apk" | head -1); fi
          if [ -z "$APK_PATH" ]; then APK_PATH=$(find . -name "*-signed.apk" | head -1); fi
          if [ -z "$APK_PATH" ]; then APK_PATH=$(find . -name "*.apk" | head -1); fi
          if [ -z "$APK_PATH" ]; then echo "No APK found — check the published build log."; exit 1; fi
          cp "$APK_PATH" "${{ inputs.app_name }}.apk"

      - name: Create GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: "${{ inputs.app_name }} APK"
          files: ${{ github.workspace }}/project/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
